name: CI

on:
  push:
    branches:
      - main
      - "codex/**"
      - "agent/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 9 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore ClaudeCodePanel.Windows.sln

      - name: Build
        run: dotnet build ClaudeCodePanel.Windows.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test ClaudeCodePanel.Windows.sln --configuration Release --no-build --logger "trx;LogFileName=test-results.trx"
