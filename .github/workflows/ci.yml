name: CI

on:
  push:
    branches:
      - main
      - "codex/**"
      - "agent/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: windows-latest
    env:
      PublishProject: src/ClaudeCodePanel.Windows/ClaudeCodePanel.Windows.csproj
      PublishDir: ${{ github.workspace }}\publish\win-x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 9 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore ClaudeCodePanel.Windows.sln

      - name: Build
        run: dotnet build ClaudeCodePanel.Windows.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test ClaudeCodePanel.Windows.sln --configuration Release --no-build --logger "trx;LogFileName=test-results.trx"

      - name: Publish EXE
        run: >
          dotnet publish $env:PublishProject
          --configuration Release
          --framework net9.0-windows
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          --output $env:PublishDir

      - name: Upload EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClaudeConsole-win-x64
          path: ${{ env.PublishDir }}
          if-no-files-found: error
